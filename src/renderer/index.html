<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';
               img-src 'self' data:; font-src 'self' data:;
               media-src 'self' file: blob:;">
<title>Low Tide</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-navigator" viewBox="0 0 16 16"><path d="M2.5 3.5h11M2.5 8h11M2.5 12.5h7"/></symbol>
  <symbol id="i-sprint" viewBox="0 0 16 16"><circle cx="8" cy="9" r="5.2"/><path d="M8 6.4V9l1.8 1.2M6.2 1.8h3.6"/></symbol>
  <symbol id="i-focus" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.4"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-preview" viewBox="0 0 16 16"><path d="M3.5 1.8h6l3 3v9.4h-9z"/><path d="M9.2 1.9v3.2h3.1M5.6 8.4h4.8M5.6 11h3.2"/></symbol>
  <symbol id="i-prefs" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 11.5h11"/><circle cx="6" cy="4.5" r="1.7" fill="var(--surface)"/><circle cx="10.5" cy="11.5" r="1.7" fill="var(--surface)"/></symbol>
  <symbol id="i-home" viewBox="0 0 16 16"><path d="M2.4 7.2L8 2.6l5.6 4.6"/><path d="M3.8 8.2v5.2h8.4V8.2"/></symbol>
  <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></symbol>
  <symbol id="i-min" viewBox="0 0 12 12"><path d="M2 6h8"/></symbol>
  <symbol id="i-max" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-close" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M9.8 3.5L5.3 8l4.5 4.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2"/></symbol>
  <symbol id="i-scratch" viewBox="0 0 16 16"><path d="M3.4 2.2h9.2v11.6H3.4z"/><path d="M5.6 5.4h4.8M5.6 8h4.8M5.6 10.6h3"/></symbol>
  <symbol id="i-revision" viewBox="0 0 16 16"><path d="M2.6 12.2l6.2-6.2 3.2 3.2-6.2 6.2H2.6z" transform="translate(0,-2.2)"/><path d="M10.4 2.6l2 2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2"/></symbol>
  <symbol id="i-more" viewBox="0 0 16 16"><circle cx="3.4" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="12.6" cy="8" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-text" viewBox="0 0 16 16"><path d="M2.6 3.6h10.8M2.6 6.6h10.8M2.6 9.6h7.6M2.6 12.6h5.4"/></symbol>
  <symbol id="i-pages" viewBox="0 0 16 16"><rect x="3" y="2.2" width="10" height="11.6" rx="1.2"/><path d="M5.4 5.2h5.2M5.4 8h5.2M5.4 10.8h3.2"/></symbol>
  <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 10.6V2.4M5 5.4L8 2.4l3 3"/><path d="M2.8 9.6v3.2h10.4V9.6"/></symbol>
  <symbol id="i-outline" viewBox="0 0 16 16"><path d="M2.6 3.4h4.6M2.6 6.6h4.6M2.6 9.8h4.6M2.6 13h4.6"/><path d="M9.8 2.4h3.6v11.2H9.8z"/></symbol>
  <symbol id="i-book2" viewBox="0 0 16 16"><path d="M2.8 2.8h4c.9 0 1.6.7 1.6 1.6v8.8c0-.9-.7-1.6-1.6-1.6h-4zM13.2 2.8h-4c-.9 0-1.6.7-1.6 1.6v8.8c0-.9.7-1.6 1.6-1.6h4z"/></symbol>
  <symbol id="i-music" viewBox="0 0 16 16"><path d="M5.8 12.2V3.6l7-1.4v8.6"/><circle cx="4.1" cy="12.4" r="1.7"/><circle cx="11.1" cy="10.8" r="1.7"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.6 8s2.5-4 6.4-4 6.4 4 6.4 4-2.5 4-6.4 4S1.6 8 1.6 8z"/><circle cx="8" cy="8" r="1.7"/></symbol>
  <symbol id="i-theme" viewBox="0 0 16 16"><path d="M6.1 9.9l-3.3 3.3M9.6 2.6l3.8 3.8-4.1 4.1-3.8-3.8z"/><path d="M4.6 10.4c-.9-.9-2.4-.3-2.4 1 0 .8-.3 1.4-.9 1.9.9.6 2.2.8 3.2.2.9-.5 1.1-1.8.1-3.1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.5 10.5l3 3"/></symbol>
  <symbol id="i-stats" viewBox="0 0 16 16"><path d="M3 13V7.4M6.4 13V3.2M9.8 13V8.8M13.2 13V5.6"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 16 16"><path d="M11.2 2.6l2.2 2.2-8 8-3 .8.8-3z"/></symbol>
</svg>

<header class="titlebar" id="titlebar">
  <div class="tb-side tb-left">
    <button class="icon-btn win-only" id="btn-appmenu" title="Menu"><svg><use href="#i-menu"/></svg></button>
    <button class="icon-btn" id="btn-home" title="Home"><svg><use href="#i-home"/></svg></button>
    <button class="icon-btn" id="btn-navigator" title="Navigator"><svg><use href="#i-navigator"/></svg></button>
  </div>

  <div class="tb-title" id="doc-title-wrap">
    <span id="doc-title">Untitled</span><span class="dot" id="dirty-dot"></span>
  </div>

  <div class="tb-side tb-right">
    <div class="tb-buttons" id="tb-buttons"></div>
    <div class="win-controls win-only">
      <button class="wc" id="wc-min" title="Minimize"><svg><use href="#i-min"/></svg></button>
      <button class="wc" id="wc-max" title="Maximize"><svg><use href="#i-max"/></svg></button>
      <button class="wc wc-close" id="wc-close" title="Close"><svg><use href="#i-close"/></svg></button>
    </div>
  </div>
</header>

<div class="workspace" id="workspace">
  <aside class="sidebar" id="sidebar">
    <div class="side-tabs">
      <button class="side-tab" data-tab="navigator" title="Navigator"><svg><use href="#i-navigator"/></svg></button>
      <button class="side-tab" data-tab="stats" title="Statistics"><svg><use href="#i-stats"/></svg></button>
      <button class="side-tab" data-tab="scratch" title="Scratchpad"><svg><use href="#i-scratch"/></svg></button>
      <button class="side-tab" data-tab="revisions" title="Revisions"><svg><use href="#i-revision"/></svg></button>
      <button class="side-tab" data-tab="reference" title="Dictionary and Thesaurus"><svg><use href="#i-book2"/></svg></button>
    </div>

    <div class="side-panel" data-panel="navigator">
      <div class="nav-head">
        <span>Navigator</span>
        <span class="nav-total" id="nav-total"></span>
      </div>
      <div class="nav-list" id="nav-list"></div>
      <div class="nav-filter">
        <svg class="mini"><use href="#i-search"/></svg>
        <input type="text" id="nav-filter" placeholder="Filter" spellcheck="false">
      </div>
    </div>

    <div class="side-panel" data-panel="stats" hidden>
      <div class="goal" id="goal">
        <svg class="goal-ring" viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="52"/>
          <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52"/>
        </svg>
        <button class="goal-face" id="goal-face">
          <span class="goal-count" id="goal-count">Set Goal</span>
          <span class="goal-of" id="goal-of">of</span>
          <span class="goal-target" id="goal-target"></span>
          <span class="goal-label" id="goal-label"></span>
        </button>
        <button class="goal-action" id="goal-action" hidden></button>
      </div>

      <div class="side-title">Goal History</div>
      <div class="goal-history" id="goal-history"></div>

      <div class="side-title">Document Stats</div>
      <div class="doc-stats">
        <div><span class="k">Pages</span><span class="v" id="ds-pages">0</span></div>
        <div><span class="k">Reading Time</span><span class="v" id="ds-time">0 min</span></div>
        <div><span class="k">Words</span><span class="v" id="ds-words">0</span></div>
        <div><span class="k">Selected</span><span class="v" id="ds-selwords">&mdash;</span></div>
        <div><span class="k">Characters</span><span class="v" id="ds-chars">0</span></div>
        <div><span class="k">Selected</span><span class="v" id="ds-selchars">&mdash;</span></div>
      </div>
    </div>
    <div class="side-panel" data-panel="scratch" hidden>
      <div class="nav-head"><span>Scratchpad</span><span class="nav-total" id="scratch-state"></span></div>
      <textarea id="scratchpad" class="scratchpad" spellcheck="true"
                placeholder="Notes about this document. Never printed, never counted."></textarea>
    </div>

    <div class="side-panel" data-panel="reference" hidden>
      <div class="nav-head"><span>Reference</span></div>
      <div class="ref-head">
        <input type="text" id="ref-input" class="filter-input" placeholder="Look up a word" spellcheck="false">
        <button class="btn" id="ref-go">Look up</button>
      </div>
      <div class="ref-results" id="ref-results"></div>
      <div class="ref-foot" id="ref-foot"></div>
    </div>

    <div class="side-panel" data-panel="revisions" hidden>
      <div class="nav-head">
        <span>Revisions</span>
        <button class="icon-btn tiny" id="rev-new" title="New revision"><svg class="mini"><use href="#i-plus"/></svg></button>
      </div>
      <div class="rev-list" id="rev-list"></div>
      <div class="rev-foot">
        <label class="check"><input type="checkbox" id="rev-show" checked><span>Show marks</span></label>
      </div>
    </div>
  </aside>

  <div class="pane">
    <div class="pane-split">
      <div class="view-area" id="view-area">
        <div class="view-switch" id="view-switch">
          <div class="vs-group">
            <button class="vs-btn on" id="view-text" title="Editor"><svg><use href="#i-text"/></svg></button>
            <button class="vs-btn" id="btn-preview" title="Pages"><svg><use href="#i-pages"/></svg></button>
          </div>
          <div class="vs-group">
            <button class="vs-btn" id="btn-outline" title="Outline"><svg><use href="#i-outline"/></svg></button>
          </div>
        </div>
        <div class="editor-host" id="editor-host"></div>

    <section class="preview-host" id="preview-host" hidden>
      <div class="preview-bar">
        <span class="preview-title" id="preview-title">Preview</span>
        <span class="preview-actions">
          <button class="text-btn" data-export="pdf">PDF</button>
          <button class="text-btn" data-export="html">HTML</button>
          <button class="text-btn" data-export="docx">Word</button>
          <button class="text-btn" data-export="txt">Text</button>
        </span>
      </div>
      <div class="preview-scroll" id="preview-scroll"></div>
      <div class="preview-foot">
        <label class="check"><input type="checkbox" id="pv-title"><span>Title Page</span></label>
        <label class="check"><input type="checkbox" id="pv-notes"><span>Notes</span></label>
        <button class="btn primary" id="pv-pdf">Save as PDF</button>
      </div>
    </section>
      </div>

    <div class="side-dock" id="side-dock" hidden>
      <div class="dock-grip" id="dock-grip" title="Drag to resize"></div>
      <div class="dock-head">
        <span class="dock-title" id="dock-title">Outline</span>
        <span class="dock-tools" id="dock-tools"></span>
        <button class="icon-btn" id="dock-close" title="Close"><svg class="mini"><use href="#i-close"/></svg></button>
      </div>
      <div class="dock-body" id="dock-body"></div>
    </div>
    </div>

    <footer class="statusbar" id="statusbar">
      <div class="sb-left"><span id="save-state">New document</span></div>
      <div class="sb-center">
        <span id="stat-chars">0 characters</span>
        <span id="stat-words">0 words</span>
        <span id="stat-pages">0 pages</span>
      </div>
      <div class="sb-right">
        <span id="rev-active" hidden></span>
        <span id="sprint-status" hidden></span>
      </div>
    </footer>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div id="panel-host"></div>
<div class="toast" id="toast" hidden></div>

<script src="dist/renderer.js"></script>
</body>
</html>
