name: Release

# Building and publishing artifacts is scoped to a tag push (v1.2.3) so a
# normal commit to main never uploads anything. Windows and Linux publish to
# GitHub Releases so electron-updater has something to check against; mac
# still builds here (a dmg/zip needs a real Mac to build on) but is never
# auto-updated by the app, so publishing it is only for the manual-download
# path already in the README.

on:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Published so the dmg/zip land on the release for manual download (the
      # README's Install table) — the app itself still never auto-updates on
      # mac (see usesAutoUpdater() in src/main/main.js), so the update-metadata
      # file electron-builder uploads alongside it is simply never read.
      #
      # hdiutil detach on the mounted dmg volume is a known-flaky step on
      # GitHub's macOS runners (intermittent "Resource busy"); retry the whole
      # build+publish rather than fail the release over a transient mount race.
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: npm run build:renderer && npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keeps the (separate, personal) homebrew-lowtide tap current. Quietly does
  # nothing until HOMEBREW_TAP_TOKEN is set as a repo secret and that tap repo
  # actually exists — continue-on-error so a missing tap never fails a release.
  homebrew:
    needs: mac
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-homebrew-tap.mjs "${GITHUB_REF_NAME#v}"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The pacman target shells out to bsdtar (via fpm) to build the package's
      # MTREE metadata; it isn't on the runner's default image.
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm run dist:linux:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
